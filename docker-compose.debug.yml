services:
  flask-app:
    build: .
    image: flask-app:dev
    container_name: flask-debug-container
    ports:
      - "8000:8000"  # Flask/Gunicorn port
      - "5678:5678"  # Debugger port
    volumes:
      - ./app:/app
      - ./service_acc:/app/service_acc
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_acc/service-account.json
    # This overrides the Dockerfile CMD to install the debugger on the fly
    command: >
      sh -c "pip install debugpy && 
             python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 --wait-for-client 
             -m gunicorn --workers 1 --threads 1 --timeout 3600 --bind 0.0.0.0:8000 app:app"